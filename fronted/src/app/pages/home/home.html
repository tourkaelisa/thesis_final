<section class="home-page">
  <div class="search-hero">
    <h1>Βρες γρήγορα το προϊόν που ψάχνεις</h1>

    <form class="search-bar" (ngSubmit)="searchProducts()">
      <div class="input-wrapper">
        <input
          name="searchTerm"
          type="search"
          [(ngModel)]="searchTerm"
          placeholder="Αναζήτηση για laptops, κινητά, tablets..."
          autocomplete="off"
        >
      </div>
      <button mat-flat-button color="primary" type="submit" class="search-btn">
        <mat-icon>search</mat-icon>
        Αναζήτηση
      </button>
    </form>
  </div>

  <!-- Top 8 δημοφιλέστερα — εμφανίζεται σε όλους τους χρήστες -->
  <section *ngIf="popularProducts().length > 0" class="popular-section" aria-label="Δημοφιλή προϊόντα">
    <div class="section-header">
      <div>
        <h2>Δημοφιλέστερα προϊόντα</h2>
      </div>
    </div>

    <div class="product-grid">
      <a *ngFor="let p of popularProducts()"
         class="product-card"
         [routerLink]="['/product', myEncode(p.id)]">
        <div class="product-card-media">
          <img [src]="p.image" [alt]="p.name">
        </div>
        <div class="product-card-body">
          <p class="product-card-name">{{ p.name }}</p>
          <p class="product-card-price">{{ p.price | number:'1.2-2' }} €</p>
        </div>
      </a>
    </div>
  </section>

  <!-- Personalized recommendations — εμφανίζεται μόνο αν ο χρήστης έχει wishlist -->
  <section *ngIf="personalizedProducts().length > 0" class="personalized-section" aria-label="Προτάσεις για εσάς">
    <div class="section-header">
      <div>
        <h2>Προτάσεις ειδικά για εσάς</h2>
      </div>
    </div>

    <div class="product-grid">
      <a *ngFor="let p of personalizedProducts()"
         class="product-card"
         [routerLink]="['/product', myEncode(p.id)]">
        <div class="product-card-media">
          <img [src]="p.image" [alt]="p.name">
        </div>
        <div class="product-card-body">
          <p class="product-card-name">{{ p.name }}</p>
          <p class="product-card-price">{{ p.price | number:'1.2-2' }} €</p>
        </div>
      </a>
    </div>
  </section>
</section>
